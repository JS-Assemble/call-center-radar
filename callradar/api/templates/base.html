<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Call-Centre Radar{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="/static/js/citation-seek.js" defer></script>
</head>
<body>
    <header>
        <h1><a href="/" style="text-decoration:none;color:inherit;">Call-Centre Radar</a></h1>
        <form class="search-box" method="get" action="/search">
            <input type="search" name="q" placeholder="Search transcripts or jump to a call id&hellip;">
        </form>
    </header>
    <nav class="nav">
        <a href="/">Dashboard</a>
        <a href="/customers">Customers</a>
        <a href="/trends">Trends</a>
        <a href="/agents">Agents</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
